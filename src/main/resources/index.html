<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI Admin Chat Test</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        #chat { border: 1px solid #ccc; height: 400px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { color: blue; text-align: right; margin: 5px 0; }
        .ai { color: green; text-align: left; margin: 5px 0; }
    </style>
</head>
<body>
<h2>AI Assistant Admin Panel</h2>
<div id="chat"></div>
<input type="text" id="prompt" placeholder="Введите запрос..." style="width: 80%;">
<button onclick="sendMessage()">Отправить</button>

<script>
    async function sendMessage() {
        const input = document.getElementById('prompt');
        const chat = document.getElementById('chat');
        const text = input.value;
        if (!text) return;

        chat.innerHTML += `<div class="user"><b>Вы:</b> ${text}</div>`;
        input.value = '';

        const response = await fetch('/api/v1/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });

        const answer = await response.text();
        chat.innerHTML += `<div class="ai"><b>AI:</b> ${answer}</div>`;
        chat.scrollTop = chat.scrollHeight;
    }
</script>
</body>
</html>
